
The DRIVER script in the kick-scripts directory 
drives all smartinit downscaling jobs, scripts, ush, and codes

in kick-scripts dir
edit DRIVER
set RUNTYP=conus,ak,hi,pr, aknest3,conusnest2p5
cyc=00,06,12,18
hrstr >= 00, <=84
endhrs

in parm dir
edit dng_para_cfg config directories
homedng=root dir where smartinit system resides
COM_IN=input coarse model directory (eg:/com/nam/prod)
COMOUT=output directory to save downscaled files (eg:/ptmp/${USER})

in jobs dir
edit smartinit.ver
to set the model_ver to use (eg; v3.2.0)


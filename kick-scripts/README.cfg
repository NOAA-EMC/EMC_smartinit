
The DRIVER script in the kick-scripts directory 
drives all smartinit downscaling jobs, scripts, ush, and codes

1. in kick-scripts dir
  edit DRIVER

for mdl=nam downscaling:
  set RUNTYP=conus,ak,hi,pr, aknest3, and/or conusnest2p5  
for mdl=dgex:
  set RUNTYP=dgex-cs,dgex-ak
for mdl=hiresw:
  set RUNTYP=guamnmmb, guamarw

  set cyc=00,06,12,18
  set hrstr >= 00, <=84
  set endhrs=>00, <=84

change smarttinit.ver to your version number (eg: v3.2.3)

2. in parm dir
  edit smart_para_cfg config directories
    homedng=root dir where smartinit system resides (eg:/meso/Jeff.McQueen/smartinit)
    COM_IN=input coarse model directory (eg:/com/${mdl}/prod)
    COMOUT=output directory to save downscaled files (eg:/ptmp/${USER})

3. in docs dir
  edit smartinit.ver to set the model_ver to use (eg; v3.2.3)

4. in sorc dir, recompile codes with makefile.

ADANCED:

To add a new domain, 
edit SMINIT.CTL in parm directory
   * set RUNTYP, rg, outreg, mdlgrd,SREF-GRD, GRDTYP, ogrd, gtyp
         rg=run id defaults to the first two letters of RUNTYP name
         outreg=user definded outreg indicator for output file nam
         mdlgrd=input model region identifier (part of input file name)
         SREF-GRD = Input SREF GRIB domain grid number (eg: 212, 216, 243..)
         ogrd= ouput NDFD GRIB grid domain number to downscale to (eg: 184, 187, 91....)

for example,the SMINIT.CTL file

RUNTYP       rg   outreg   mdlgrd   SREF-GRD    GRDTYP   ogrd   gtyp nx  ny   lat1  lon1 gdt tlon   dx  dy
------------------------------------------------------------------------------------------------------------------
conus        con  conus    ""         212       bgrd3d   197     3  1073 689 20192 238446 8 265000 5079 5079
conusnest    con  conus    conusnest  212      .bsmart   197     3  1073 689 20192 238446 8 265000 5079 5079
ak           ak   ak       ""         216       bgrd3d   198     5   825 553 40530 181429 8 210000 5953 5953
ak_rtmages   ak   ak       ""         216       bgrd3d   198     5   825 553 40530 181429 8 210000 5953 5953
alaskanest   ak   ak       alaskanest 216      .bsmart   198     198

The above varaibles define the input and output file name and output grid.

Say a user will define  a new grid

hrrr-cs     cs   conus     conushrrr   212     .bsmart   187     187

where the input file will be  ${mdl}.tCCz.${mdlgrd}${GRDTYP}HH.tm00
or 
hrrr.tCCz.conushrrr.bsmartHH.tm00

and will be downscaled to  
* defined ogrd number 187 (extended conus 2.5 km grid)
* using the SREF-GRD 212 (North American domain) probability files.

The output file name will be using mdl and outreg varbs:

${mdl).tCCz.smart${outreg)HH.tm00
or 
hrrr.t12z.smartconusHH.tm00


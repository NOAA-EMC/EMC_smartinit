
The DRIVER script in the kick-scripts directory 
drives all smartinit downscaling jobs, scripts, ush, and codes

in kick-scripts dir
  edit DRIVER
  set RUNTYP=conus,ak,hi,pr, aknest3, and/or conusnest2p5
  set cyc=00,06,12,18
  set hrstr >= 00, <=84
  set endhrs=>00, <=84

in parm dir
  edit smart_para_cfg config directories
    homedng=root dir where smartinit system resides (eg:/meso/Jeff.McQueen/smartinit)
    COM_IN=input coarse model directory (eg:/com/nam/prod)
    COMOUT=output directory to save downscaled files (eg:/ptmp/${USER})

in docs dir
  edit smartinit.ver to set the model_ver to use (eg; v3.2.0)


ADANCED:

To add a new domain, 
edit SMINIT.CTL in parm directory
   * set RUNTYP, reg, oreg....names
